<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Habits, reminders and a focus timer for people who forget and put things off." />

    <!-- PWA / home-screen app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Do It" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <style id="expo-reset">
      html, body { height: 100%; }
      body {
        overflow: hidden;
        margin: 0;
        background: #F8F7F3;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      input, textarea { -webkit-user-select: text; user-select: text; }
      @media (prefers-color-scheme: dark) { html, body { background: #050505; } }
      #root { display: flex; height: var(--app-h, 100%); flex: 1; }
      /* iOS standalone: fill the whole screen incl. under the status bar.
         While the keyboard is up, --app-h is the space above it. */
      @supports (height: 100dvh) { html, body, #root { height: var(--app-h, 100dvh); } }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Do It.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
